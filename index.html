<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./Assets/style.css">
  <title>Text-Editors</title>
</head>

<body>

  <main>
    <nav class="navbar navbar-expand bg-dark p-3">
      <div class="container">
        <a href="#" class="navbar-brand text-white">
          <img src="./Assets/image/white_on_trans.png" alt="LOGO" srcset="" class="logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarButtons">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarButton">
          <div class="d-flex flex-row align-items-center gap-2">
            <button class="btn btn-primary" onclick="color()"><i class="fa-solid fa-paintbrush"></i></button>
            <button class="btn btn-primary" onclick="undo()"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="btn btn-primary" onclick="redo()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="btn btn-primary" onclick="fsize()"><i class="fa-solid fa-font"></i></button>

            <button class="btn btn-success fw-bold " onclick="saveNote()">Save</button>
          </div>
        </div>
      </div>
    </nav>
    <div class="container my-4">
      <textarea class="form-control p-4 shadow-sm" rows="15" id="editArea" placeholder="Write something"></textarea>
    </div>
    <div class="container">
      <h4 class="mt-4">Saved Notes</h4>
      <div id="savedNotes" class="mt-3"></div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="./Assets/text.js"></script>
</body>

</html>
